<!doctype html>
<html lang="hy">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#e6e6d8"><meta name="description" content="Նուրբ ձմեռային հրավիրատոմս՝ բացվող ձիթապտղագույն ծրարով։">
 <title>Հրավիրատոմս 069</title><link rel="stylesheet" href="style.css?v=069-1"><script src="script.js?v=069-1" defer></script>
</head>
<body>
 <main class="winter-scene" id="scene">
  <section class="invitation-cover" id="cover" aria-label="Հրավիրատոմսի ծրարը">
   <p class="invitation-from">YOU HAVE AN<br>INVITATION FROM</p>
   <h1 class="hosts" data-hosts>Patricia &amp; Adam</h1>
   <button class="envelope" id="open-envelope" aria-label="Բացել հրավիրատոմսը" aria-controls="inside" aria-expanded="false">
    <span class="envelope-back paper" aria-hidden="true"></span>
    <span class="envelope-pocket paper" aria-hidden="true"></span>
    <span class="fold fold-left paper" aria-hidden="true"></span>
    <span class="fold fold-right paper" aria-hidden="true"></span>
    <span class="flap-shadow" aria-hidden="true"><svg viewBox="0 0 500 330" preserveAspectRatio="none"><path d="M0 0H500V30L250 210 0 30Z"/></svg></span>
    <span class="flap paper" aria-hidden="true"><svg viewBox="0 0 500 220" preserveAspectRatio="none"><path d="M0 30 250 210 500 30"/></svg></span>
    <span class="seal-decoration" aria-hidden="true"><img src="assets/winter-seal.png" alt="" width="600" height="400" fetchpriority="high"></span>
   </button>
   <p class="open-caption" id="open-caption">CLICK TO OPEN</p>
  </section>
  <section class="inside" id="inside" hidden aria-label="Բացված հրավերը">
   <p class="invitation-from">ԴՈՒՔ ՀՐԱՎԻՐՎԱԾ ԵՔ</p><h2 class="hosts" data-hosts>Patricia &amp; Adam</h2>
   <span class="inside-rule" aria-hidden="true"></span><p class="inside-message">Ձեր ներկայությունը մեր օրվա ամենաթանկ նվերն է։</p>
   <button class="close-invitation" id="close-envelope">Փակել հրավերը</button>
  </section>
 </main>
 <noscript><p class="noscript">Հրավիրատոմսը բացելու համար միացրեք JavaScript-ը։</p></noscript>
</body>
</html>
